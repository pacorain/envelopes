name: Slither Static Analysis

on:
  pull_request:
    paths:
      - 'contracts/**'

jobs:
  slither:
    name: Run Slither analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --workspace=contracts
      - uses: crytic/slither-action@v0.4.2
        id: slither
        with:
          target: 'contracts/contracts/'
          solc-version: '0.8.34'
          slither-args: >-
            --checklist
            --markdown-root ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/
            --solc-remaps @openzeppelin/=node_modules/@openzeppelin/
            --filter-paths node_modules
          sarif: results.sarif
          fail-on: high
      - name: Post Slither results as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let sarif;
            try {
              sarif = JSON.parse(fs.readFileSync('results.sarif', 'utf8'));
            } catch {
              console.log('No SARIF output found — skipping comment');
              return;
            }

            const results = sarif.runs?.[0]?.results ?? [];
            const rules = Object.fromEntries(
              (sarif.runs?.[0]?.tool?.driver?.rules ?? []).map(r => [r.id, r])
            );

            const levelLabel = { error: '🔴 High', warning: '🟡 Medium', note: '🔵 Low/Info' };
            const grouped = {};
            for (const result of results) {
              const level = result.level ?? 'note';
              (grouped[level] ??= []).push(result);
            }

            const marker = '<!-- slither-analysis -->';
            let body = `${marker}\n## Slither Analysis\n\n`;

            if (results.length === 0) {
              body += '_No issues found._\n';
            } else {
              for (const level of ['error', 'warning', 'note']) {
                if (!grouped[level]?.length) continue;
                body += `### ${levelLabel[level]}\n\n`;
                for (const result of grouped[level]) {
                  const name = rules[result.ruleId]?.name ?? result.ruleId;
                  const msg = result.message?.text ?? '';
                  const loc = result.locations?.[0]?.physicalLocation;
                  const uri = loc?.artifactLocation?.uri ?? '';
                  const line = loc?.region?.startLine;
                  const locStr = uri ? ` — \`${uri}${line ? `:${line}` : ''}\`` : '';
                  body += `- **${name}**${locStr}: ${msg}\n`;
                }
                body += '\n';
              }
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # TODO: This project is currently private. Once it is released under an open
      # source license, replace the PR comment above with GitHub code scanning:
      #
      # - name: Upload SARIF file
      #   uses: github/codeql-action/upload-sarif@v4
      #   with:
      #     sarif_file: ${{ steps.slither.outputs.sarif }}
