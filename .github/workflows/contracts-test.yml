name: Contracts Tests

on:
  pull_request:
    paths:
      - 'contracts/**'

jobs:
  contracts-test:
    name: Run contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npm run test -w contracts
